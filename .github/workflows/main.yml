# .github/workflows/main.yml
#
# Runs on every pull request targeting main. Two required checks:
#   1. flake8 lint (app/ and tests/)
#   2. pytest test suite
# Runs on both Ubuntu and Windows since this app must work on both.
# Pair this with a branch protection rule on `main` (Settings > Branches)
# requiring this workflow to pass before merge -- see notes at the bottom.

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    name: build-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      # Pinned to major version tags published by GitHub -- avoids
      # supply-chain drift from an unpinned @main/@latest reference.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: flake8 app tests --max-line-length=120

      - name: Run tests
        run: python -m pytest tests/ -v

      # Safeguard: fail loudly if the suite somehow collected 0 tests,
      # instead of letting an empty/broken test file report a false green.
      - name: Verify tests actually ran
        run: |
          python -m pytest tests/ --collect-only -q | tail -5
          COUNT=$(python -m pytest tests/ --collect-only -q | grep -c "::" || true)
          if [ "$COUNT" -eq "0" ]; then
            echo "ERROR: 0 tests collected -- test suite is empty or broken."
            exit 1
          fi
        shell: bash
