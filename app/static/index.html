<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEL — IRL Fault Code Assistant</title>
  <meta name="description" content="Offline AI-powered chatbot for IRL fault code lookup. Powered by local inference — no internet required." />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
        </svg>
        <span>BEL AI</span>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span>New Chat</span>
    </button>

    <div class="sidebar-section-label">Quick Lookup</div>
    <div class="sidebar-chips" id="sidebarChips">
      <button class="chip" data-q="What does error code 0x0003 mean?">0x0003 — Fire aborted</button>
      <button class="chip" data-q="What is a misfire error?">Misfire errors</button>
      <button class="chip" data-q="What causes fire abort?">Fire abort cause</button>
      <button class="chip" data-q="What is depth setting failed?">Depth setting</button>
      <button class="chip" data-q="Explain error code 0x0017">0x0017 — Depth fail</button>
      <button class="chip" data-q="What does throw range invalid mean?">Throw range errors</button>
    </div>

    <div class="sidebar-footer">
      <div class="status-badge" id="statusBadge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusLabel">Checking…</span>
      </div>
      <div class="sidebar-meta">
        <span>Model: <code id="footerModel">—</code></span>
        <span>100% Offline</span>
      </div>
    </div>
  </aside>

  <!-- ── Main Chat Area ──────────────────────────────────────────────── -->
  <div class="chat-area" id="chatArea">

    <!-- Top bar (mobile) -->
    <header class="topbar" id="topbar">
      <button class="topbar-menu" id="menuBtn" aria-label="Open sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="topbar-title">BEL Fault Code Assistant</span>
      <span class="topbar-status">
        <span class="status-dot" id="statusDotMobile"></span>
      </span>
    </header>

    <!-- Messages container -->
    <div class="messages" id="messages">

      <!-- Welcome message (shown on fresh load) -->
      <div class="welcome" id="welcomeScreen">
        <div class="welcome-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
          </svg>
        </div>
        <h1 class="welcome-title">BEL Fault Code Assistant</h1>
        <p class="welcome-sub">Ask me about any IRL fault code. I'll look it up in the knowledge base and give you a grounded answer — completely offline.</p>
        <div class="welcome-chips">
          <button class="welcome-chip" data-q="What does error code 0x0003 mean?">
            <span class="wchip-icon">⚡</span>
            <span class="wchip-text">What does 0x0003 mean?</span>
          </button>
          <button class="welcome-chip" data-q="What is a misfire error?">
            <span class="wchip-icon">🔥</span>
            <span class="wchip-text">What is a misfire error?</span>
          </button>
          <button class="welcome-chip" data-q="Explain error 0x0017">
            <span class="wchip-icon">🔧</span>
            <span class="wchip-text">Explain error 0x0017</span>
          </button>
          <button class="welcome-chip" data-q="What does throw range invalid mean?">
            <span class="wchip-icon">📡</span>
            <span class="wchip-text">What is throw range invalid?</span>
          </button>
        </div>
      </div>

    </div>

    <!-- Input bar (fixed at bottom) -->
    <div class="input-bar" id="inputBar">
      <div class="input-bar-inner">
        <textarea
          id="queryInput"
          class="chat-input"
          placeholder="Ask about any IRL fault code..."
          rows="1"
          autocomplete="off"
          spellcheck="false"
        ></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">
        <span>Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</span>
      </div>
    </div>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
