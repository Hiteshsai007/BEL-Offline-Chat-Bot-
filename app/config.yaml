# BEL Offline AI Interface — Central Configuration
# All tunables live here. No code changes needed for common adjustments.

model:
  # Ollama model tag — change to upgrade LLM without touching code.
  # After changing, re-run setup (ollama pull <new tag>) once.
  #
  # Recommended options (Q4_K_M quantization, default Ollama build):
  #   qwen2.5:3b   ~2 GB disk,  ~3 GB VRAM  — current default, fast, 32K context
  #   qwen2.5:7b   ~5 GB disk,  ~6 GB VRAM  — better prose synthesis, 32K context
  #   qwen2.5:14b  ~9 GB disk, ~10 GB VRAM  — high quality, needs 16 GB RAM, 32K context
  #
  # Disk sizes are Ollama download sizes (Q4_K_M quantization).
  # Context windows are Ollama's default build (32K).  The model family
  # supports up to 128K per Qwen's paper, but Ollama ships 32K by default.
  #
  # The 7b model is recommended for general-document queries (manuals,
  # guides) where longer context and prose synthesis matter.  The 3b
  # model is sufficient for the structured fault-code corpus.
  ollama_tag: "qwen2.5:3b"
  # Ollama listens on loopback ONLY (Section 12 — no remote inference)
  ollama_url: "http://127.0.0.1:11434"
  temperature: 0.1
  max_tokens: 512
  # Timeout for a single LLM call (seconds)
  # 7b model needs 30-60s on CPU; 120s gives headroom for guardrail retries.
  timeout_seconds: 120

  # Context window size sent to Ollama.
  num_ctx: 8192

embedding:
  # Offline-distributable model — weights pre-downloaded at setup
  model_name: "BAAI/bge-small-en-v1.5"
  # CPU-only: preserve all GPU VRAM for Ollama (Section 11)
  device: "cpu"
  # BGE models benefit from this query prefix
  query_prefix: "Represent this sentence for searching relevant passages: "

retrieval:
  # Over-fetch for re-ranking, then trim to return_n
  top_k: 10
  # Cosine similarity threshold — drop candidates below this score
  confidence_threshold: 0.50
  # Number of chunks passed as context to the LLM
  return_n: 5
  # Regex pattern to trigger exact error-code direct lookup (bypasses embedding)
  error_code_pattern: "0x[0-9a-fA-F]{4}"
  # Score at or above this → deterministic template answer (fast path).
  # Below this → LLM synthesis (slow path).
  # Exact code lookups always score 1.0 regardless of this value.
  # See scripts/verify_threshold_scores.py to validate against real embeddings.
  direct_answer_threshold: 0.80

  # ── Hybrid Search (BM25 + Dense) ──────────────────────────────────────
  # BM25 sparse retrieval is combined with dense (embedding) retrieval
  # using Reciprocal Rank Fusion (RRF). This dramatically improves recall
  # for keyword-heavy queries that dense embeddings alone may miss.
  bm25_enabled: true
  # RRF constant (k) — higher values give more weight to lower-ranked results.
  # Standard value is 60; lower values (e.g. 20) make top results dominate more.
  rrf_k: 60
  # Number of candidates to fetch from EACH retriever before fusion.
  # After fusion and deduplication, the top return_n results are kept.
  retrieval_candidates: 50

  # ── Cross-Encoder Reranker ─────────────────────────────────────────────
  # Re-scores top candidates jointly with the query for exact attribute relevance.
  reranker_enabled: false
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

paths:
  faiss_index: "data/index/faiss.index"
  chunks_store: "data/index/chunks.jsonl"
  session_db: "data/session.db"
  log_file: "logs/app.log"
  # Source PDF for ingestion
  source_pdf: "IRL Fault Codes.pdf"

server:
  # Loopback only — not accessible from other machines (Section 12)
  host: "127.0.0.1"
  port: 8000

logging:
  level: "INFO"
  max_bytes: 10485760  # 10 MB
  backup_count: 3

session:
  max_history_turns: 4
  max_stored_messages: 100
  max_message_chars: 300

